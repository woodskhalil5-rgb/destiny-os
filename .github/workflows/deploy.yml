# Deploys Destiny OS on every push to main.
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  — supabase.com/dashboard/account/tokens
#   VERCEL_TOKEN           — vercel.com/account/tokens
# Database migrations are applied separately (they change live data), not by this workflow.
name: Deploy
on:
  push:
    branches: [main]
    paths: ["supabase/functions/**", "apps/dashboard/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

concurrency: deploy-${{ github.ref }}

jobs:
  functions:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: xicywfiquzqvlulwirln
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy edge functions
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "SUPABASE_ACCESS_TOKEN not set; skipping."; exit 0; fi
          for f in os-api os-billing os-jobs; do supabase functions deploy "$f" --project-ref "$PROJECT_REF" --no-verify-jwt; done
          supabase functions deploy os-brain --project-ref "$PROJECT_REF"

  dashboard:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_z6qkbBqw2aDRL2Z1uebWXrPA
      VERCEL_PROJECT_ID: prj_sl0ANuXmX6SFbttPsyYCzIJ6Badz
    steps:
      - uses: actions/checkout@v4
      - name: Deploy dashboard
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then echo "VERCEL_TOKEN not set; skipping."; exit 0; fi
          # The Vercel project's root directory is apps/dashboard, so deploy from the repo root.
          npx --yes vercel@39.3.0 deploy --prod --yes --token "$VERCEL_TOKEN"
